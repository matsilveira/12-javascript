<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quicklist - Lista de Compras</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">
      <img class="desktop-only" src="assets/logo.svg" alt="">
    </div>

    <div id="back">
      <img src="" alt="">
      <span>← Voltar</span>
    </div>
    <h1>Compras da semana</h1>
  </header>
  
  <main>
    <div class="add-item">
      <input type="text" placeholder="Adicione um novo item">
      <button>Adicionar item</button>
    </div>

    <div id="items">
      <label class="item">
        <input type="checkbox" id="cbox1" value="first_checkbox">
        <span class="check">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7L4.25 8.75L9.5 3.25" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span for="cbox1">Pão de forma</span>
        <img class="remove" src="assets/icons/trash.svg" alt="Remover item">
      </label>

      <label class="item">
        <input type="checkbox" id="cbox2" value="second_checkbox">
        <span class="check">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7L4.25 8.75L9.5 3.25" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span for="cbox2">Café preto</span>
        <img class="remove" src="assets/icons/trash.svg" alt="Remover item">
      </label>

      <label class="item">
        <input type="checkbox" id="cbox3" value="third_checkbox">
        <span class="check">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7L4.25 8.75L9.5 3.25" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span for="cbox3">Suco de laranja</span>
        <img class="remove" src="assets/icons/trash.svg" alt="Remover item">
      </label>

      <label class="item">
        <input type="checkbox" id="cbox4" value="fourth_checkbox">
        <span class="check">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 7L4.25 8.75L9.5 3.25" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span for="cbox4">Bolacha</span>
        <img class="remove" src="assets/icons/trash.svg" alt="Remover item">
      </label>
    </div>
    
    <div class="error">
      <img src="assets/icons/warning.svg" alt="Ícone de atenção">
      <span>O item foi removido da lista</span>
      <img class="remove" src="assets/icons/delete.svg" alt="">
    </div>
  </main>
  
</body>
</html>
